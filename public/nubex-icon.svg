<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B1528" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>

    <!-- Glowing Cyan Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="50%" stopColor="#0088FF" />
      <stop offset="100%" stopColor="#0047BA" />
    </linearGradient>

    <!-- N Letter Gradient -->
    <linearGradient id="nLetterGrad" x1="8" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#E0F7FF" />
      <stop offset="60%" stopColor="#00E5FF" />
      <stop offset="100%" stopColor="#0077EE" />
    </linearGradient>

    <!-- Cloud Glow -->
    <linearGradient id="cloudGlow" x1="16" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5FF" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#0055FF" stopOpacity="0.05" />
    </linearGradient>

    <!-- Truck Gradient -->
    <linearGradient id="truckGrad" x1="28" y1="30" x2="58" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0099FF" />
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Square Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="url(#borderGrad)" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Cloud Background Silhouette -->
  <path
    d="M26 22C26 17.58 29.58 14 34 14C37.3 14 40.1 16 41.3 19C42.4 18.4 43.7 18 45 18C48.87 18 52 21.13 52 25C52 25.5 51.9 26 51.8 26.5C54.2 27.5 56 29.8 56 32.5C56 36.09 53.09 39 49.5 39H26V22Z"
    fill="url(#cloudGlow)"
  />

  <!-- Bold Stylized NUBEX 'N' with Cyber 3D Cut -->
  <g filter="url(#cyanGlow)">
    <!-- Left Column of N -->
    <path
      d="M11 15C11 13.34 12.34 12 14 12H18C19.66 12 21 13.34 21 15V49C21 50.66 19.66 52 18 52H14C12.34 52 11 50.66 11 49V15Z"
      fill="url(#nLetterGrad)"
    />
    
    <!-- Diagonal Slice of N -->
    <path
      d="M18 13.5L34 40.5V50.5C34 51.33 33.33 52 32.5 52H30.5L16 26.5V14.5C16 13.95 16.45 13.5 17 13.5H18Z"
      fill="#FFFFFF"
      opacity="0.95"
    />
    
    <!-- Right Column of N -->
    <path
      d="M27 15C27 13.34 28.34 12 30 12H34C35.66 12 37 13.34 37 15V49C37 50.66 35.66 52 34 52H30C28.34 52 27 50.66 27 49V15Z"
      fill="url(#nLetterGrad)"
    />
  </g>

  <!-- High-Speed Delivery / Transport Truck Motif on Right -->
  <g filter="url(#cyanGlow)">
    <!-- Cargo Body -->
    <rect x="36" y="27" width="13" height="12" rx="2" fill="url(#truckGrad)" />
    <!-- Cab -->
    <path d="M49 31H54.5C55.3 31 56 31.7 56.4 32.4L58.5 35.8C58.8 36.3 59 36.9 59 37.5V39H49V31Z" fill="#00E5FF" />
    <!-- Cab Window -->
    <path d="M50 32.5H53.8L55.5 35.5H50V32.5Z" fill="#09182C" />
    
    <!-- Wheels -->
    <circle cx="41" cy="40.5" r="3" fill="#030712" stroke="#00E5FF" stroke-width="1.2" />
    <circle cx="53" cy="40.5" r="3" fill="#030712" stroke="#00E5FF" stroke-width="1.2" />

    <!-- Speed Streaks Underneath -->
    <path d="M30 45H57" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />
    <path d="M38 48H52" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
